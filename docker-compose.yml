version: "3.9"

# ============================================================
# Guardrail local dev / test stack
#
#   redis  — Redis 7 for optional embedding cache (port 6379)
#
# PostgreSQL / pgvector is no longer required. Seed embeddings
# are computed at startup from classpath:semantic/semantic_seeds.csv
# and held entirely in the JVM heap.
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop containers (data preserved)
#   docker compose down -v       # stop + delete volumes
# ============================================================

services:

  redis:
    image: redis:7-alpine
    container_name: guardrail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
