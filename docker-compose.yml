version: "3.9"

# ============================================================
# Guardrail local dev / test stack
#
#   pgvector  — PostgreSQL 16 + pgvector extension (port 5432)
#   redis     — Redis 7 for embedding cache        (port 6379)
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop containers (data preserved)
#   docker compose down -v       # stop + delete volumes
# ============================================================

services:

  pgvector:
    image: pgvector/pgvector:pg16          # official pgvector image
    container_name: guardrail-pgvector
    restart: unless-stopped
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      # Auto-run on first container start (alphabetical order → schema before seed)
      - ./src/main/resources/db/01_semantic_schema.sql:/docker-entrypoint-initdb.d/01_semantic_schema.sql:ro
      - ./src/main/resources/db/02_semantic_seed.sql:/docker-entrypoint-initdb.d/02_semantic_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail -d guardrail_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: guardrail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgvector_data:
  redis_data:
