forge:
  guardrail:
    production-mode: ${GUARDRAIL_PRODUCTION_MODE:true}

    semantic:
      enabled: ${SEMANTIC_ENABLED:true}
      fail-open: ${SEMANTIC_FAIL_OPEN:false}

      top-k: ${SEMANTIC_TOP_K:10}

      category-thresholds:
        bias: ${BIAS_THRESHOLD:0.65}
        toxicity: ${TOXICITY_THRESHOLD:0.78}
        prompt-injection: ${PROMPT_INJECTION_THRESHOLD:0.70}
        jailbreak: ${JAILBREAK_THRESHOLD:0.70}

      onnx:
        model-path: ${ONNX_MODEL_PATH}
        tokenizer-path: ${TOKENIZER_PATH}
        max-tokens: ${ONNX_MAX_TOKENS:128}
        intra-op-threads: ${ONNX_THREADS:1}

      # Optional — Redis caches per-request ONNX embeddings to avoid redundant model inference.
      # Remove this block (or set enabled: false) if you do not have Redis.
      redis:
        enabled: ${REDIS_ENABLED:true}
        ttl-seconds: ${REDIS_TTL_SECONDS:3600}
        key-prefix: ${REDIS_KEY_PREFIX:guardrail:emb:}

spring:
  # Only needed when forge.guardrail.semantic.redis.enabled=true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
